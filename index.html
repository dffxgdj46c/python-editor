<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코드를 굽는 마술사</title>
    <!-- 파비콘 설정 -->
    <link rel="icon" href="./favicon.ico">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #d4d4d4;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: #252526;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #333;
        }
        header img {
            max-height: 50px;
            object-fit: contain;
        }
        .tab-container {
            display: flex;
            background-color: #2d2d2d;
            overflow-x: auto;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }
        .tab {
            padding: 10px 20px;
            background-color: #2d2d2d;
            color: #969696;
            border-right: 1px solid #252526;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            user-select: none;
        }
        .tab.active {
            background-color: #1e1e1e;
            color: #fff;
            border-top: 2px solid #007acc;
        }
        .tab .close-btn {
            font-size: 12px;
            padding: 2px 5px;
            border-radius: 3px;
        }
        .tab .close-btn:hover {
            background-color: #444;
        }
        .add-tab-btn {
            padding: 10px 15px;
            background-color: transparent;
            color: #969696;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        .add-tab-btn:hover {
            color: #fff;
            background-color: #333;
        }
        .editor-container {
            flex-grow: 1;
            position: relative;
            background-color: #1e1e1e;
        }
        textarea {
            width: 100%;
            height: 100%;
            background-color: #1e1e1e;
            color: #d4d4d4;
            border: none;
            padding: 15px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 15px;
            resize: none;
            outline: none;
            line-height: 1.5;
            tab-size: 4;
        }
    </style>
</head>
<body>

    <header>
        <img src="./logo.png" alt="코드를 굽는 마술사 로고">
    </header>

    <div class="tab-container" id="tabContainer">
        <!-- 탭들이 동적으로 생성됩니다 -->
        <button class="add-tab-btn" id="addTabBtn" title="새 탭 추가">+</button>
    </div>

    <div class="editor-container">
        <textarea id="codeEditor" placeholder="코드를 입력하세요..."></textarea>
    </div>

    <script>
        const STORAGE_KEY = 'multi_editor_data_v6';
        
        let state = {
            tabs: [
                { id: '1', title: 'main.py', content: 'print("아 똥싸고 싶다!")' }
            ],
            activeTabId: '1'
        };

        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    state = JSON.parse(saved);
                } catch (e) {
                    console.error('데이터 로드 실패', e);
                }
            }
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        const tabContainer = document.getElementById('tabContainer');
        const addTabBtn = document.getElementById('addTabBtn');
        const codeEditor = document.getElementById('codeEditor');

        function render() {
            // 기존 탭 요소들 제거 (추가 버튼 전까지)
            document.querySelectorAll('.tab').forEach(el => el.remove());

            state.tabs.forEach(tab => {
                const tabEl = document.createElement('div');
                tabEl.className = `tab ${tab.id === state.activeTabId ? 'active' : ''}`;
                tabEl.innerHTML = `
                    <span>${tab.title}</span>
                    ${state.tabs.length > 1 ? '<span class="close-btn">×</span>' : ''}
                `;

                tabEl.addEventListener('click', (e) => {
                    if (e.target.classList.contains('close-btn')) {
                        e.stopPropagation();
                        closeTab(tab.id);
                        return;
                    }
                    switchTab(tab.id);
                });

                tabContainer.insertBefore(tabEl, addTabBtn);
            });

            const activeTab = state.tabs.find(t => t.id === state.activeTabId);
            if (activeTab) {
                codeEditor.value = activeTab.content;
            }
            saveData();
        }

        function switchTab(id) {
            state.activeTabId = id;
            render();
        }

        function addTab() {
            const newId = Date.now().toString();
            const newTitle = `script_${state.tabs.length + 1}.py`;
            state.tabs.push({ id: newId, title: newTitle, content: '' });
            state.activeTabId = newId;
            render();
        }

        function closeTab(id) {
            if (state.tabs.length <= 1) return;
            const index = state.tabs.findIndex(t => t.id === id);
            state.tabs.splice(index, 1);
            if (state.activeTabId === id) {
                state.activeTabId = state.tabs[state.tabs.length - 1].id;
            }
            render();
        }

        codeEditor.addEventListener('input', (e) => {
            const activeTab = state.tabs.find(t => t.id === state.activeTabId);
            if (activeTab) {
                activeTab.content = e.target.value;
                saveData();
            }
        });

        addTabBtn.addEventListener('click', addTab);

        // 초기 실행
        loadData();
        render();
    </script>
</body>
</html>
